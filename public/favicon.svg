<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#0a0010"/>
  <!-- TOP C-bracket: goes up-across-down, opens right -->
  <path
    d="M 10 42 L 10 13 L 50 13 C 56 13 60 17 60 23 C 60 29 56 34 50 34 L 10 34"
    stroke="white"
    stroke-width="9.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />
  <!-- BOTTOM C-bracket: goes down-across-up, opens left -->
  <path
    d="M 54 22 L 54 51 L 14 51 C 8 51 4 47 4 41 C 4 35 8 30 14 30 L 54 30"
    stroke="white"
    stroke-width="9.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />
</svg>