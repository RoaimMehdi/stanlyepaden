<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Stanley Paden Official Author Site — Award-winning Sci-Fi author of The Box, Return from Egypt, and I Hate Saint Louis." />
  <title>Stanley Paden — Official Author Universe</title>
  <script>
    // Apply saved theme (or system preference) before first paint to avoid flash
    (function () {
      try {
        var saved = localStorage.getItem('sp-theme');
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body class="antialiased selection:bg-purple-600 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
